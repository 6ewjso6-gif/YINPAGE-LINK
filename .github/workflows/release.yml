# ============================================================================
#  YINPAGE-LINK 自动构建 + 签名 + 发布
# ============================================================================
#  触发方式：
#   1) 推送 `APP-t-v*` 标签（正式发布）：构建 → 签名 → 创建 GitHub Release 并附 APK
#   2) workflow_dispatch（手动）：只构建 + 签名，上传 signed APK 为构建产物（不建 Release）
#
#  签名密钥来源：仓库 Settings → Secrets and variables → Actions，全部私有：
#    RELEASE_KEYSTORE_B64  密钥库文件（base64）
#    RELEASE_KEYSTORE_PASS 密钥库口令
#    RELEASE_KEY_PASS      私钥口令
#    RELEASE_KEY_ALIAS     别名
#  密钥不进入任何代码/文件，杜绝开源仓库泄露签名。
#
#  N9：所有第三方 Action 固定到 commit SHA（tag 可被上游重指，属供应链风险）。
#  N6：发布构建用 `-PversionName=$GITHUB_REF_NAME` 把 tag 注入 versionName，
#      与 Release 的 tag_name 同源，避免「本机版本名落后于 tag → 无限提示更新」。
#  N7：APK 附件名统一为 `<tag>-signed.apk`（tag 本身已含 APP-t- 前缀）。
# ============================================================================
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "APP-t-v*"

permissions:
  contents: write

jobs:
  build-sign:
    name: Build & Sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # GitHub 托管 runner 自带 Android SDK（ANDROID_HOME 已预设、许可已接受），
      # 缺失的平台/构建工具由 AGP 自动补下。
      - name: Decode release keystore (from Secrets)
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "${GITHUB_WORKSPACE}/keystore-release.jks"
          test -s "${GITHUB_WORKSPACE}/keystore-release.jks"
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}

      - name: Build & sign release APK
        run: |
          # N6：仅在 tag 触发时注入 versionName，使其与 Release tag 严格一致；
          # 手动 workflow_dispatch 的 ref 是分支名，不能当版本号，走默认值。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ./gradlew :app:assembleRelease --no-daemon --console=plain \
              -PversionName="${GITHUB_REF_NAME}"
          else
            ./gradlew :app:assembleRelease --no-daemon --console=plain
          fi
        env:
          RELEASE_KEYSTORE: ${{ github.workspace }}/keystore-release.jks
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

      - name: Verify signature
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -4

      - name: Prepare APK name (<tag>-signed.apk)
        run: |
          # N7：tag 本身已是 APP-t-v*.*，直接用 <tag>-signed.apk，避免 APP-t-APP-t- 双前缀。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME}"; else NAME="APP-t-latest"; fi
          APK="app/build/outputs/apk/release/${NAME}-signed.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # N1：随包发布 SHA-256 附件（<apk>.sha256），App 内下载后据此做哈希校验，
          # 与安装前的签名校验形成双重防线。
          ( cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" | awk '{print $1}' > "$(basename "$APK").sha256" )
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "SHA_PATH=${APK}.sha256" >> "$GITHUB_ENV"

      - name: Upload signed APK (manual run, no Release)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: APP-t-latest-signed
          path: |
            ${{ env.APK_PATH }}
            ${{ env.SHA_PATH }}

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ env.APK_PATH }}
            ${{ env.SHA_PATH }}
          body: |
            ## YINPAGE-LINK v0.13 更新公告

            本次修复 v0.12 一键诊断报告暴露的问题，并纠正方案判定的误导性结论。

            ### 诊断修复
            - 修复「BLE GATT 服务枚举 10 秒超时 → 未完成」：本 App 已占用控制通道时不再发起二次 GATT 连接（设备通常只接受一个连接），改为明确提示并提供正确复测方式
            - 修正 BLE 地址类型判定：`7A:xx` 这类高位 01 的地址是可解析私有地址(RPA)，不再误判为「随机静态地址」
            - 删除「地址类型 ⇒ 大概率走 BLE / SPP 只是附带」的因果推断，改为展示系统设备类型（经典 / BLE / 双模）
            - 修复方案判定把标准特征值（如 0x2A19 电量）误报为「私有服务」的问题
            - 即使 App 正在连接，也会输出设备 SDP 注册的 RFCOMM UUID，便于定位真正的控制通道
            - 诊断「是否为 HyperOS」不再只显示裸版本号「4」，适配器占位地址 `02:00:00:00:00:00` 增加说明
            - GATT 连接回调优先判断 status，失败时直接给出人话原因，不再空等超时

            ### 兼容性
            - 版本号 APP-t-v0.13（1800013000），可直接覆盖安装 v0.12，数据不丢失
            - 旧版本用户可在「设置 → 检查更新」自动升级
          draft: false
          prerelease: false